name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip
          for d in */; do
            if [ -f "$d/build.gradle" ]; then
              mv $d/* ./
              mv $d/.[!.]* ./ 2>/dev/null || true
              rm -rf $d
              break
            fi
          done
          ls -la

      - name: Download official gradle wrapper from Fabric template
        run: |
          curl -L -o template.zip https://github.com/FabricMC/fabric-example-mod/archive/refs/heads/26.1.2.zip
          unzip -o template.zip
          cp fabric-example-mod-26.1.2/gradlew .
          cp fabric-example-mod-26.1.2/gradlew.bat .
          mkdir -p gradle/wrapper
          cp fabric-example-mod-26.1.2/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp fabric-example-mod-26.1.2/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew
          rm -rf template.zip fabric-example-mod-26.1.2

      - name: Fix gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
          minecraft_version=26.1.2
          loader_version=0.19.2
          fabric_version=0.102.0
          loom_version=1.10.0
          mod_version=26.1.2
          maven_group=com.example.renderutilitiz
          archives_base_name=renderutilitiz
          EOF

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
