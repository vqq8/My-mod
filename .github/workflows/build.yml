name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Gradle wrapper from Fabric template
        run: |
          curl -L -o template.zip https://github.com/FabricMC/fabric-example-mod/archive/refs/heads/26.1.2.zip
          unzip -o template.zip
          cp -r fabric-example-mod-26.1.2/gradle .
          cp fabric-example-mod-26.1.2/gradlew .
          cp fabric-example-mod-26.1.2/gradlew.bat .
          cp fabric-example-mod-26.1.2/build.gradle .
          cp fabric-example-mod-26.1.2/settings.gradle .
          cp fabric-example-mod-26.1.2/gradle.properties .
          chmod +x gradlew
          rm -rf template.zip fabric-example-mod-26.1.2

      - name: Override gradle.properties with your mod info
        run: |
          sed -i 's/^mod_version=.*/mod_version=26.1.2/' gradle.properties
          sed -i 's/^maven_group=.*/maven_group=com.example.renderutilitiz/' gradle.properties
          sed -i 's/^archives_base_name=.*/archives_base_name=renderutilitiz/' gradle.properties

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar