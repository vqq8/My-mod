name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o *.zip
          # Move contents from any subfolder to root
          if [ -d renderutiliz ]; then mv renderutiliz/* ./; rm -rf renderutiliz; fi
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
